/* ═══════════════════════════════════════════════════════════════════════
   SCREEN 2 · CAPTURE NOW
   Recording is simulated — a real build stores audio, not a transcript.
   ═══════════════════════════════════════════════════════════════════════ */
function CaptureScreen({ go, openMenu, onSaveMemo, onSaveThought, toast }) {
  const [tab, setTab] = useState("record");       // record | write
  const [phase, setPhase] = useState("idle");     // idle | recording | review
  const [secs, setSecs] = useState(0);
  const [text, setText] = useState("");
  const tick = useRef(null);

  useEffect(() => () => clearInterval(tick.current), []);

  const start = () => { setPhase("recording"); setSecs(0); tick.current = setInterval(() => setSecs(s => s + 1), 1000); };
  const stop  = () => { clearInterval(tick.current); setPhase("review"); };
  const discard = () => { clearInterval(tick.current); setSecs(0); setPhase("idle"); };

  const saveMemo = () => {
    onSaveMemo({ id: "m" + Date.now(), title: "Voice memo", duration: secs || 12, date: new Date().toISOString(), linked: null });
    toast("Saved as audio · kept offline");
    setPhase("idle"); setSecs(0); go("home");
  };
  const saveText = () => {
    onSaveThought(text.trim());
    toast("Thought saved");
    setText(""); go("home");
  };

  return (
    <>
      <Header title="Capture Now" subtitle="Nothing is transcribed until you ask" onBack={() => go("home")} onAvatar={() => go("profile")} />

      {/* mode switch */}
      <div className="shrink-0 px-5 pt-1 pb-4">
        <div className="flex p-1 rounded-2xl bg-[var(--surface-2)] border border-[var(--border)]">
          {[["record", "Record"], ["write", "Write"]].map(([id, label]) => (
            <button key={id} onClick={() => { setTab(id); setPhase("idle"); }}
              className={`press flex-1 py-2.5 rounded-xl text-[14px] font-medium
                ${tab === id ? "bg-[var(--surface)] text-[var(--text)]" : "text-[var(--muted)]"}`}
              style={tab === id ? { boxShadow: "var(--shadow)" } : {}}>{label}</button>
          ))}
        </div>
      </div>

      <div className="scroll flex-1 px-5 pb-6">
        {tab === "record" ? (
          <div className="flex flex-col items-center pt-6">
            {phase !== "review" ? (
              <>
                <button onClick={phase === "idle" ? start : stop}
                  className="press relative w-40 h-40 rounded-full grid place-items-center bg-[var(--accent)] text-[var(--on-accent)]"
                  style={{ boxShadow: "0 18px 40px -18px var(--accent)" }}>
                  {phase === "recording" && <>
                    <span className="absolute inset-0 rounded-full bg-[var(--accent)]" style={{ animation: "pulseRing 2s infinite" }} />
                    <span className="absolute inset-0 rounded-full bg-[var(--accent)]" style={{ animation: "pulseRing 2s .6s infinite" }} />
                  </>}
                  {phase === "recording"
                    ? <div className="flex items-end gap-1.5 h-12 wave">
                        {[...Array(7)].map((_, i) =>
                          <span key={i} style={{ height: 44, animationDelay: `${i * .12}s`, animationDuration: `${.7 + (i % 3) * .2}s` }} />)}
                      </div>
                    : <IconMic size={54} sw={1.3} />}
                </button>

                <div className="mt-7 text-center">
                  {phase === "recording" ? (
                    <>
                      <div className="text-[34px] font-light tabular-nums tracking-tight text-[var(--text)]">{fmtDur(secs)}</div>
                      <div className="text-[13px] text-[var(--muted)] mt-1 flex items-center justify-center gap-2">
                        <span className="w-2 h-2 rounded-full bg-red-500 animate-pulse" /> Recording · tap to stop
                      </div>
                    </>
                  ) : (
                    <>
                      <div className="text-[17px] font-medium text-[var(--text)]">Tap to start recording</div>
                      <p className="text-[13.5px] text-[var(--muted)] mt-2 max-w-[260px] leading-relaxed">
                        Speak freely. It's saved as audio, not turned into text, so nothing interrupts you.
                      </p>
                    </>
                  )}
                </div>
              </>
            ) : (
              /* memo review card */
              <div className="w-full anim-up">
                <div className="text-center mb-5">
                  <div className="text-[17px] font-medium text-[var(--text)]">Ready to keep?</div>
                  <div className="text-[13px] text-[var(--muted)] mt-1">Stored on your device</div>
                </div>
                <MemoCard memo={{ title: "New voice memo", duration: secs || 12, date: new Date().toISOString() }} />
                <div className="grid grid-cols-2 gap-3 mt-5">
                  <Button variant="outline" onClick={discard}><IconTrash size={17} />Delete</Button>
                  <Button onClick={saveMemo}><IconCheck size={17} sw={2.2} />Save</Button>
                </div>
                <button onClick={() => { saveMemo(); }} className="press w-full mt-3 text-[13.5px] text-[var(--muted)] py-2">
                  Save and reflect on it later
                </button>
              </div>
            )}
          </div>
        ) : (
          <div className="anim-up">
            <textarea
              value={text} onChange={e => setText(e.target.value)} autoFocus
              placeholder="What just happened, and what went through your mind?"
              className="w-full h-64 rounded-3xl p-5 bg-[var(--surface)] border border-[var(--border)]
                         text-[15.5px] leading-relaxed text-[var(--text)] placeholder:text-[var(--muted)] resize-none"
              style={{ boxShadow: "var(--shadow)" }} />
            <div className="flex items-center justify-between mt-3 px-1">
              <span className="text-[12px] text-[var(--muted)]">{text.trim().split(/\s+/).filter(Boolean).length} words</span>
              <span className="text-[12px] text-[var(--muted)]">Categorise it later</span>
            </div>
            <div className="grid grid-cols-2 gap-3 mt-5">
              <Button variant="outline" onClick={() => go("home")}>Cancel</Button>
              <Button onClick={saveText} disabled={!text.trim()}><IconCheck size={17} sw={2.2} />Save</Button>
            </div>
          </div>
        )}
      </div>
    </>
  );
}

/* A saved voice memo, with a fake transport */
function MemoCard({ memo, onSelect, selected }) {
  const [playing, setPlaying] = useState(false);
  const [pos, setPos] = useState(0);
  useEffect(() => {
    if (!playing) return;
    const t = setInterval(() => setPos(p => {
      if (p >= memo.duration) { setPlaying(false); return 0; }
      return p + 1;
    }), 320);
    return () => clearInterval(t);
  }, [playing, memo.duration]);

  return (
    <Card onClick={onSelect}
      className={`p-4 ${onSelect ? "press cursor-pointer" : ""} ${selected ? "!border-[var(--accent)]" : ""}`}>
      <div className="flex items-center gap-3.5">
        <button onClick={e => { e.stopPropagation(); setPlaying(p => !p); }}
          className="press w-12 h-12 rounded-full grid place-items-center bg-[var(--accent)] text-[var(--on-accent)] shrink-0">
          {playing ? <IconPause size={20} /> : <IconPlay size={20} />}
        </button>
        <div className="flex-1 min-w-0">
          <div className="text-[15px] font-medium text-[var(--text)] truncate">{memo.title}</div>
          <div className="flex items-end gap-[3px] h-6 mt-2">
            {[...Array(28)].map((_, i) => {
              const h = 6 + ((i * 37) % 17);
              const on = (i / 28) * memo.duration <= pos && playing;
              return <div key={i} className="w-[3px] rounded-full transition-colors"
                style={{ height: h, background: on ? "var(--accent)" : "var(--border)" }} />;
            })}
          </div>
          <div className="flex items-center gap-2 mt-2 text-[11.5px] text-[var(--muted)]">
            <span className="tabular-nums">{fmtDur(playing ? pos : memo.duration)}</span>
            <span>·</span><span>{fmtDate(memo.date)}</span>
          </div>
        </div>
      </div>
    </Card>
  );
}

/* ═══════════════════════════════════════════════════════════════════════
   SCREEN 3 · MINDMAP
   Central "MindMap" node → categories → shared trigger / emotion /
   compulsion nodes. Connections between thoughts are hypotheses the user
   accepts or rejects. The map only surfaces patterns; it never concludes.
   ═══════════════════════════════════════════════════════════════════════ */

const ring = (i, n, cx, cy, r, squash = .82) => {
  const a = -Math.PI / 2 + i * 2 * Math.PI / Math.max(n, 1);
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) * squash };
};
const KIND_HUE = { compulsion: null, trigger: 205, emotion: 25 };
const kindColor = (kind) => kind === "compulsion"
  ? "var(--accent)" : `hsl(${KIND_HUE[kind]} 55% 58%)`;

/* Reusable radial graph: a weighted centre with a ring of nodes.
   The SVG and the node buttons live in ONE fixed-size box that is centred,
   so the connecting lines and the bubbles share the same origin and stay
   aligned regardless of container width. */
function Graph({ centerLabel, centerSub, onCenter, nodes, hint }) {
  /* keep the largest node fully inside the box so nothing is clipped */
  const maxNode = nodes.reduce((m, n) => Math.max(m, n.size || 80), 84);
  const pad = maxNode / 2 + 8;
  const W = 320, H = 320;
  const cx = W / 2, cy = H / 2;
  const R = Math.min(W, H) / 2 - pad;      // radius that fits the ring
  const pts = nodes.map((nd, i) => ({ ...nd, ...ring(i, nodes.length, cx, cy, R) }));
  return (
    <div className="relative w-full h-full grid place-items-center anim-in">
      <div className="relative shrink-0" style={{ width: W, height: H }}>
        <svg width={W} height={H} className="absolute inset-0 overflow-visible">
          {pts.map(p => (
            <line key={p.key} x1={cx} y1={cy} x2={p.x} y2={p.y}
                  stroke="var(--border)" strokeWidth="1.4" strokeDasharray={p.dashed ? "2 5" : "0"} />
          ))}
          <circle cx={cx} cy={cy} r="54" fill="var(--soft)" opacity=".55" />
        </svg>
        <button onClick={onCenter}
          className="press absolute rounded-full grid place-items-center text-center z-10"
          style={{ left: cx - 50, top: cy - 50, width: 100, height: 100,
                   background: "var(--accent)", color: "var(--on-accent)",
                   boxShadow: "0 14px 34px -12px var(--accent)" }}>
          <div>
            <div className="wordmark text-[12px] leading-none">{centerLabel}</div>
            {centerSub && <div className="eyebrow text-[8px] opacity-80 mt-1.5">{centerSub}</div>}
          </div>
        </button>
        {pts.map(p => {
          const s = p.size || 80;
          return (
            <button key={p.key} onClick={p.onClick}
              className="press absolute rounded-full grid place-items-center text-center p-2 border anim-up"
              style={{ left: p.x - s / 2, top: p.y - s / 2, width: s, height: s,
                       background: "var(--surface)", borderColor: p.color || "var(--border)",
                       boxShadow: "var(--shadow)" }}>
              <span className="leading-tight text-[var(--text)] line-clamp-3" style={{ fontSize: p.fs || 11 }}>{p.label}</span>
              {p.badge != null && <span className="mono text-[8.5px] text-[var(--muted)] mt-0.5">{p.badge}</span>}
            </button>
          );
        })}
      </div>
      {hint && <div className="absolute bottom-2 inset-x-0 text-center eyebrow text-[9px] text-[var(--muted)] pointer-events-none">{hint}</div>}
    </div>
  );
}

const Tag = ({ children, dot }) => (
  <span className="inline-flex items-center gap-1.5 text-[12px] px-2.5 py-1 rounded-full bg-[var(--surface-2)] border border-[var(--border)] text-[var(--muted)]">
    {dot != null && <span className="w-2 h-2 rounded-full" style={{ background: dot }} />}{children}
  </span>
);

function MapScreen({ go, openMenu, thoughts, onUpdate, toast, cats, setCats, connections, setConnections }) {
  const [mode, setMode] = useState("overview");      // overview | category
  const [lens, setLens] = useState("categories");    // categories | patterns | list
  const [selCat, setSelCat] = useState(null);
  const [detail, setDetail] = useState(null);
  const [entity, setEntity] = useState(null);        // {kind, id}
  const [wizard, setWizard] = useState(null);
  const [manage, setManage] = useState(false);
  const [opens, setOpens] = useState(0);             // rumination counter
  const [muted, setMuted] = useState(false);

  const countCat = (id) => thoughts.filter(t => t.cats.includes(id)).length;
  const openDetail = (t) => { setDetail(t); setOpens(o => o + 1); };
  const openEntity = (kind, id) => { setEntity({ kind, id }); setOpens(o => o + 1); };
  const ruminating = opens >= 7 && !muted;

  /* shared nodes appearing in ≥2 thoughts — the visible patterns */
  const patternNodes = useMemo(() => {
    const out = [];
    ["compulsion", "trigger", "emotion"].forEach(kind => {
      const dict = NODE_DICT[kind];
      Object.keys(dict).forEach(id => {
        const n = thoughts.filter(t => nodeIds(t, kind).includes(id)).length;
        if (n >= 2) out.push({ kind, id, label: dict[id], n });
      });
    });
    return out.sort((a, b) => b.n - a.n).slice(0, 7);
  }, [thoughts]);

  return (
    <>
      <Header title="MindMap" subtitle={`${thoughts.length} thoughts · ${cats.length} categories`}
              onMenu={openMenu} onAvatar={() => go("profile")} />

      {/* lens switch */}
      <div className="shrink-0 px-5 pb-3 flex items-center gap-2">
        <div className="flex p-1 rounded-2xl bg-[var(--surface-2)] border border-[var(--border)] flex-1">
          {[["categories", "Categories"], ["patterns", "Patterns"], ["list", "List"]].map(([id, l]) => (
            <button key={id} onClick={() => { setLens(id); setMode("overview"); }}
              className={`press flex-1 py-2 rounded-xl text-[13px]
                ${lens === id && mode === "overview" ? "bg-[var(--surface)] text-[var(--text)]" : "text-[var(--muted)]"}`}
              style={lens === id && mode === "overview" ? { boxShadow: "var(--shadow)" } : {}}>{l}</button>
          ))}
        </div>
        <button onClick={() => setManage(true)}
          className="press w-10 h-10 rounded-xl grid place-items-center bg-[var(--surface-2)] border border-[var(--border)] text-[var(--muted)]">
          <IconFilter size={18} />
        </button>
      </div>

      {ruminating && (
        <div className="shrink-0 mx-5 mb-2 p-3.5 rounded-2xl bg-[var(--soft)] border border-[var(--border)] anim-up">
          <p className="text-[13.5px] text-[var(--text)] leading-snug">
            You've opened a lot of connections just now. The map is for noticing, not for solving —
            more looking rarely brings more certainty.
          </p>
          <div className="flex gap-2 mt-2.5">
            <Button className="!py-2 !px-4 text-[13px]" onClick={() => go("home")}>Step away</Button>
            <Button variant="ghost" className="!py-2 !px-4 text-[13px]" onClick={() => { setMuted(true); setOpens(0); }}>Keep looking</Button>
          </div>
        </div>
      )}

      {/* body — the graph area reserves space top and bottom so nothing
          overlaps the info bar above it or the add button below it */}
      {mode === "overview" && lens === "categories" && (
        <div className="flex-1 relative overflow-hidden etch pb-16">
          <Graph centerLabel="MindMap" centerSub="your patterns"
            onCenter={() => setManage(true)}
            hint="Tap a category to open it"
            nodes={cats.map(c => ({
              key: c.id, label: c.label, badge: countCat(c.id),
              color: `hsl(${c.hue} 50% 60% / .6)`,
              size: 64 + Math.min(countCat(c.id), 4) * 7, fs: 10.5,
              onClick: () => { setSelCat(c.id); setMode("category"); },
            }))} />
        </div>
      )}

      {mode === "overview" && lens === "patterns" && (
        <div className="flex-1 flex flex-col min-h-0">
          <div className="shrink-0 px-5 pb-1">
            <Card className="p-3">
              <p className="text-[12.5px] text-[var(--muted)] leading-snug">
                These threads recur across several thoughts. A shared thread is a pattern to notice — not a conclusion about you.
              </p>
            </Card>
          </div>
          <div className="flex-1 relative overflow-hidden etch pb-16">
            <Graph centerLabel="MindMap" centerSub="shared threads"
              onCenter={() => {}}
              hint="Blue trigger · orange emotion · accent compulsion"
              nodes={patternNodes.map(p => ({
                key: p.kind + p.id, label: p.label, badge: `×${p.n}`,
                color: kindColor(p.kind), size: 60 + p.n * 7, fs: 10,
                onClick: () => openEntity(p.kind, p.id),
              }))} />
          </div>
        </div>
      )}

      {mode === "overview" && lens === "list" && (
        <div className="scroll flex-1 px-5 pb-24 space-y-3 stagger">
          {thoughts.map(t => (
            <Card key={t.id} className="p-4 press cursor-pointer" onClick={() => openDetail(t)}>
              <div className="flex items-center gap-2 mb-2 flex-wrap">
                {t.cats.map(cid => (
                  <span key={cid} className="mono text-[9.5px] text-[var(--muted)] flex items-center gap-1">
                    <span className="w-1.5 h-1.5 rounded-full" style={{ background: `hsl(${hueOf(cid, cats)} 55% 55%)` }} />
                    {catOf(cid, cats).label}
                  </span>
                ))}
                <span className="mono text-[9.5px] text-[var(--muted)] ml-auto">{fmtDate(t.date)}</span>
              </div>
              <div className="text-[16px] text-[var(--text)] leading-snug">“{t.thought}”</div>
              <div className="flex flex-wrap gap-1.5 mt-3">
                <Tag>{t.emotion}</Tag><Tag>{t.compulsion}</Tag>
              </div>
            </Card>
          ))}
        </div>
      )}

      {mode === "category" && selCat && (
        <div className="flex-1 flex flex-col min-h-0">
          <div className="shrink-0 px-5 pb-1">
            <button onClick={() => setMode("overview")}
              className="press inline-flex items-center gap-1.5 text-[13px] text-[var(--muted)] px-3 py-1.5 rounded-full bg-[var(--surface)] border border-[var(--border)]">
              <IconBack size={15} />All categories
            </button>
          </div>
          <div className="flex-1 relative overflow-hidden etch pb-16">
            <Graph centerLabel={catOf(selCat, cats).label.split(" ")[0]}
              centerSub={`${countCat(selCat)} thoughts`} onCenter={() => {}}
              hint="Tap a thought to open it"
              nodes={thoughts.filter(t => t.cats.includes(selCat)).map(t => ({
                key: t.id, label: `“${t.thought}”`, size: 86, fs: 9.5,
                color: `hsl(${hueOf(selCat, cats)} 50% 60% / .6)`,
                onClick: () => openDetail(t),
              }))} />
          </div>
        </div>
      )}

      {/* add thought — sits in the bottom-right corner, clear of the ring */}
      <button onClick={() => setWizard({ isNew: true, thought: "", cats: [], trig: [], emo: [], comp: [] })}
        className="press absolute right-4 bottom-[84px] z-30 rounded-full grid place-items-center bg-[var(--accent)] text-[var(--on-accent)]"
        style={{ width: 52, height: 52, boxShadow: "0 12px 28px -10px var(--accent)" }}>
        <IconPlus size={24} />
      </button>

      <ThoughtDetail thought={detail} thoughts={thoughts} cats={cats} connections={connections}
        onClose={() => setDetail(null)} onOpenThought={openDetail} onOpenEntity={openEntity}
        onEdit={t => { setDetail(null); setWizard(t); }}
        onReflect={t => { setDetail(null); go("reflect", { thought: t }); }}
        onExercise={t => { setDetail(null); go("exercise", { scenario: t }); }}
        onAddCat={(t, cid) => onUpdate({ ...t, cats: [...new Set([...t.cats, cid])] })}
        onRemoveCat={(t, cid) => onUpdate({ ...t, cats: t.cats.filter(x => x !== cid) })}
        onConn={(id, status) => { setConnections(prev => prev.map(k => k.id === id ? { ...k, status } : k));
                                  toast(status === "accepted" ? "Connection accepted" : "Suggestion dismissed"); }}
        onLink={(a, b) => { setConnections(prev => [...prev, { id: "k" + Date.now(), a, b,
          basis: "You linked these thoughts.", strength: "strong", source: "user", status: "accepted" }]);
          toast("Thoughts linked"); }} />

      <EntitySheet node={entity} thoughts={thoughts} cats={cats}
        onClose={() => setEntity(null)} onOpenThought={t => { setEntity(null); openDetail(t); }} />

      <CategoriseWizard base={wizard} cats={cats} onNewCat={(c) => setCats(prev => [...prev, c])}
        onClose={() => setWizard(null)}
        onDone={(t) => { onUpdate(t); setWizard(null); toast(t._new ? "Thought added to your map" : "Categorisation updated"); }} />

      <CategoryManager open={manage} onClose={() => setManage(false)} cats={cats} setCats={setCats}
        thoughts={thoughts} onUpdate={onUpdate} toast={toast} />
    </>
  );
}

/* Shared-node sheet: which thoughts run through this trigger/emotion/compulsion */
function EntitySheet({ node, thoughts, cats, onClose, onOpenThought }) {
  if (!node) return null;
  const label = NODE_DICT[node.kind][node.id];
  const list = thoughts.filter(t => nodeIds(t, node.kind).includes(node.id));
  const kindLabel = { trigger: "Trigger", emotion: "Emotion", compulsion: "Compulsion" }[node.kind];
  return (
    <Sheet open onClose={onClose} title={label}>
      <div className="eyebrow text-[10px] text-[var(--muted)] -mt-2 mb-4">
        {kindLabel} · appears in {list.length} {list.length === 1 ? "record" : "records"}
      </div>
      <div className="space-y-2.5">
        {list.map(t => (
          <button key={t.id} onClick={() => onOpenThought(t)}
            className="press w-full text-left p-3.5 rounded-2xl bg-[var(--surface-2)] border border-[var(--border)]">
            <div className="flex items-center gap-1.5 mb-1 flex-wrap">
              {t.cats.map(cid => (
                <span key={cid} className="w-2 h-2 rounded-full" style={{ background: `hsl(${hueOf(cid, cats)} 55% 55%)` }} />
              ))}
              <span className="mono text-[9.5px] text-[var(--muted)] ml-auto">{fmtDate(t.date)}</span>
            </div>
            <div className="text-[14.5px] text-[var(--text)] leading-snug">“{t.thought}”</div>
          </button>
        ))}
      </div>
      <p className="text-[12.5px] text-[var(--muted)] leading-relaxed mt-5">
        A shared thread like this is a pattern worth noticing. It is not a diagnosis, and it doesn't mean these
        situations are the same.
      </p>
    </Sheet>
  );
}

const StrengthMeter = ({ strength }) => {
  const s = STRENGTH[strength] || STRENGTH.tentative;
  return (
    <span className="inline-flex items-center gap-2">
      <span className="w-14 h-1.5 rounded-full bg-[var(--border)] overflow-hidden">
        <span className="block h-full rounded-full bg-[var(--accent)]" style={{ width: `${s.w * 100}%` }} />
      </span>
      <span className="mono text-[9.5px] text-[var(--muted)]">{s.label}</span>
    </span>
  );
};

function ThoughtDetail({ thought, thoughts, cats, connections, onClose, onOpenThought, onOpenEntity,
                        onEdit, onReflect, onExercise, onAddCat, onRemoveCat, onConn, onLink }) {
  const [addingCat, setAddingCat] = useState(false);
  const [linking, setLinking] = useState(false);
  useEffect(() => { setAddingCat(false); setLinking(false); }, [thought]);
  if (!thought) return null;

  const t = thoughts.find(x => x.id === thought.id) || thought;
  const byId = (id) => thoughts.find(x => x.id === id);
  const conns = connections.filter(k => (k.a === t.id || k.b === t.id) && k.status !== "rejected");
  const other = (k) => byId(k.a === t.id ? k.b : k.a);
  const suggested = conns.filter(k => k.status === "suggested");
  const accepted = conns.filter(k => k.status === "accepted");
  const shareCat = (o) => o && o.cats.some(c => t.cats.includes(c));
  const availCats = cats.filter(c => !t.cats.includes(c.id));
  const linkable = thoughts.filter(x => x.id !== t.id &&
    !conns.some(k => other(k) && other(k).id === x.id));

  const NodeRow = ({ kind, label }) => (
    <div className="py-3 border-t border-[var(--border)] first:border-0">
      <div className="eyebrow text-[9.5px] text-[var(--muted)] mb-2">{label}</div>
      <div className="flex flex-wrap gap-2">
        {nodeIds(t, kind).map(id => (
          <button key={id} onClick={() => onOpenEntity(kind, id)}
            className="press text-[13px] px-3 py-1.5 rounded-full bg-[var(--surface-2)] border border-[var(--border)] text-[var(--text)]"
            style={{ borderColor: kindColor(kind) === "var(--accent)" ? "var(--accent)" : kindColor(kind) }}>
            {NODE_DICT[kind][id]}
          </button>
        ))}
        {nodeIds(t, kind).length === 0 && <span className="text-[13px] text-[var(--muted)]">Not recorded</span>}
      </div>
    </div>
  );

  return (
    <Sheet open onClose={onClose} title="Thought" full>
      <div className="eyebrow text-[10px] text-[var(--muted)] -mt-2 mb-3">{fmtDate(t.date)}</div>

      {/* weighted thought */}
      <div className="rounded-3xl bg-[var(--soft)] border border-[var(--border)] p-5">
        <div className="text-[22px] leading-snug text-[var(--text)]">“{t.thought}”</div>
        {t.note && <div className="text-[13px] text-[var(--muted)] mt-3 leading-relaxed">{t.note}</div>}
      </div>

      {/* categories — user's own grouping, multiple allowed */}
      <div className="mt-5">
        <div className="eyebrow text-[9.5px] text-[var(--muted)] mb-2">Categories</div>
        <div className="flex flex-wrap gap-2 items-center">
          {t.cats.map(cid => (
            <span key={cid} className="inline-flex items-center gap-1.5 text-[13px] pl-3 pr-2 py-1.5 rounded-full bg-[var(--surface-2)] border border-[var(--border)] text-[var(--text)]">
              <span className="w-2 h-2 rounded-full" style={{ background: `hsl(${hueOf(cid, cats)} 55% 55%)` }} />
              {catOf(cid, cats).label}
              <button onClick={() => onRemoveCat(t, cid)} className="press text-[var(--muted)] ml-0.5"><IconClose size={13} /></button>
            </span>
          ))}
          <button onClick={() => setAddingCat(v => !v)}
            className="press text-[13px] px-3 py-1.5 rounded-full border border-dashed border-[var(--border)] text-[var(--muted)] flex items-center gap-1">
            <IconPlus size={13} />Add
          </button>
        </div>
        {addingCat && (
          <div className="flex flex-wrap gap-2 mt-2.5 anim-up">
            {availCats.length ? availCats.map(c => (
              <Chip key={c.id} onClick={() => { onAddCat(t, c.id); setAddingCat(false); }}>{c.label}</Chip>
            )) : <span className="text-[12.5px] text-[var(--muted)]">On every category already.</span>}
          </div>
        )}
      </div>

      {/* shared nodes */}
      <div className="mt-5 rounded-3xl border border-[var(--border)] px-4">
        <NodeRow kind="trigger" label="Trigger" />
        <NodeRow kind="emotion" label="Emotion" />
        <NodeRow kind="compulsion" label="Compulsion / response" />
      </div>
      <p className="mono text-[9.5px] text-[var(--muted)] mt-2 px-1">Tap a node to see every thought that shares it.</p>

      {/* accepted connections */}
      {accepted.length > 0 && (
        <div className="mt-6">
          <div className="eyebrow text-[9.5px] text-[var(--muted)] mb-2.5">Connected thoughts</div>
          <div className="space-y-2">
            {accepted.map(k => { const o = other(k); if (!o) return null; return (
              <button key={k.id} onClick={() => onOpenThought(o)}
                className="press w-full text-left p-3.5 rounded-2xl bg-[var(--surface-2)] border border-[var(--border)]">
                <div className="text-[13.5px] text-[var(--text)]">“{o.thought}”</div>
                <div className="mono text-[9.5px] text-[var(--muted)] mt-1.5">
                  {k.source === "user" ? "You linked these" : "Accepted suggestion"}
                </div>
              </button>
            ); })}
          </div>
        </div>
      )}

      {/* suggested connections — hypotheses to accept or reject */}
      {suggested.length > 0 && (
        <div className="mt-6">
          <div className="eyebrow text-[9.5px] text-[var(--muted)] mb-2.5">Suggested by {APP}</div>
          <div className="space-y-2.5">
            {suggested.map(k => { const o = other(k); if (!o) return null; const unrelated = !shareCat(o); return (
              <div key={k.id} className="p-4 rounded-2xl bg-[var(--surface-2)] border border-[var(--border)]">
                {unrelated && <div className="mono text-[9px] text-[var(--accent)] mb-1.5">APPARENTLY UNRELATED</div>}
                <button onClick={() => onOpenThought(o)} className="press text-left text-[14px] text-[var(--text)] leading-snug">“{o.thought}”</button>
                <p className="text-[12.5px] text-[var(--muted)] mt-2 leading-relaxed">{k.basis}</p>
                <div className="flex items-center justify-between mt-3">
                  <StrengthMeter strength={k.strength} />
                  <div className="flex gap-2">
                    <button onClick={() => onConn(k.id, "rejected")}
                      className="press text-[12.5px] px-3 py-1.5 rounded-full border border-[var(--border)] text-[var(--muted)]">Not this</button>
                    <button onClick={() => onConn(k.id, "accepted")}
                      className="press text-[12.5px] px-3.5 py-1.5 rounded-full bg-[var(--accent)] text-[var(--on-accent)]">Accept</button>
                  </div>
                </div>
              </div>
            ); })}
          </div>
          <p className="text-[12px] text-[var(--muted)] mt-2.5 leading-relaxed">
            Suggestions are hypotheses from your own records. Nothing is treated as true until you accept it.
          </p>
        </div>
      )}

      {/* manual link */}
      <div className="mt-4">
        <button onClick={() => setLinking(v => !v)}
          className="press text-[13px] text-[var(--accent)] flex items-center gap-1.5">
          <IconPlus size={14} />Link to another thought
        </button>
        {linking && (
          <div className="mt-2 space-y-2 anim-up">
            {linkable.slice(0, 6).map(o => (
              <button key={o.id} onClick={() => { onLink(t.id, o.id); setLinking(false); }}
                className="press w-full text-left p-3 rounded-xl bg-[var(--surface-2)] border border-[var(--border)] text-[13.5px] text-[var(--text)]">
                “{o.thought}”
              </button>
            ))}
          </div>
        )}
      </div>

      <div className="space-y-2.5 mt-7">
        <Button variant="soft" onClick={() => onEdit(t)}><IconPen size={17} />Edit categorisation</Button>
        <Button variant="outline" onClick={() => onReflect(t)}><IconSpark size={17} />Reflect on this</Button>
        <Button variant="outline" onClick={() => onExercise(t)}><IconWave size={17} />Trigger exercise</Button>
      </div>
    </Sheet>
  );
}

/* Rename / add / remove / merge the user's categories */
function CategoryManager({ open, onClose, cats, setCats, thoughts, onUpdate, toast }) {
  const [mergeFrom, setMergeFrom] = useState(null);
  if (!open) return null;
  const count = (id) => thoughts.filter(t => t.cats.includes(id)).length;

  const rename = (id, label) => setCats(prev => prev.map(c => c.id === id ? { ...c, label } : c));
  const remove = (id) => {
    thoughts.filter(t => t.cats.includes(id)).forEach(t => onUpdate({ ...t, cats: t.cats.filter(x => x !== id) }));
    setCats(prev => prev.filter(c => c.id !== id));
    toast("Category removed");
  };
  const merge = (from, to) => {
    thoughts.filter(t => t.cats.includes(from)).forEach(t =>
      onUpdate({ ...t, cats: [...new Set(t.cats.map(x => x === from ? to : x))] }));
    setCats(prev => prev.filter(c => c.id !== from));
    setMergeFrom(null); toast("Categories merged");
  };
  const add = () => {
    const id = "cat_" + Date.now();
    setCats(prev => [...prev, { id, label: "New category", hue: 250, ai: false }]);
  };

  return (
    <Sheet open onClose={onClose} title="Categories" full>
      <p className="text-[13px] text-[var(--muted)] leading-relaxed mb-4">
        Categories are your own way of grouping thoughts — not diagnoses. Rename, merge or remove them freely.
      </p>
      <div className="space-y-2.5">
        {cats.map(c => (
          <div key={c.id} className="p-3.5 rounded-2xl bg-[var(--surface-2)] border border-[var(--border)]">
            <div className="flex items-center gap-2.5">
              <span className="w-3 h-3 rounded-full shrink-0" style={{ background: `hsl(${c.hue} 55% 55%)` }} />
              <input value={c.label} onChange={e => rename(c.id, e.target.value)}
                className="flex-1 bg-transparent text-[15px] text-[var(--text)] min-w-0" />
              <span className="mono text-[9.5px] text-[var(--muted)]">{count(c.id)}</span>
              {c.ai && <span className="mono text-[8.5px] text-[var(--accent)]">AI</span>}
            </div>
            <div className="flex gap-2 mt-2.5">
              <button onClick={() => setMergeFrom(mergeFrom === c.id ? null : c.id)}
                className="press text-[12px] px-2.5 py-1 rounded-full border border-[var(--border)] text-[var(--muted)]">Merge…</button>
              <button onClick={() => remove(c.id)}
                className="press text-[12px] px-2.5 py-1 rounded-full border border-[var(--border)] text-red-500 flex items-center gap-1">
                <IconTrash size={12} />Remove</button>
            </div>
            {mergeFrom === c.id && (
              <div className="flex flex-wrap gap-2 mt-2.5 anim-up">
                <span className="text-[12px] text-[var(--muted)] w-full">Merge into:</span>
                {cats.filter(x => x.id !== c.id).map(x => (
                  <Chip key={x.id} onClick={() => merge(c.id, x.id)}>{x.label}</Chip>
                ))}
              </div>
            )}
          </div>
        ))}
      </div>
      <Button variant="outline" className="w-full mt-4" onClick={add}><IconPlus size={17} />Add category</Button>
    </Sheet>
  );
}

/* Guided categorisation — the step-by-step stand-in for the chatbot flow.
   Produces a fully-formed thought: text, trigger, emotion(s), compulsion(s),
   and one or more categories (with an AI suggestion the user can change). */
function CategoriseWizard({ base, cats, onNewCat, onClose, onDone }) {
  const blank = { thought: "", trig: [], emo: [], comp: [], cats: [] };
  const [d, setD] = useState(blank);
  const [step, setStep] = useState(0);
  useEffect(() => { if (base) { setD({ ...blank, ...base }); setStep(0); } }, [base]);
  if (!base) return null;

  const toggle = (key, id) => setD(s => ({
    ...s, [key]: s[key].includes(id) ? s[key].filter(x => x !== id) : [...s[key], id],
  }));
  const single = (key, id) => setD(s => ({ ...s, [key]: [id] }));

  /* naive suggestion: a category whose typical emotion matches */
  const suggestCat = () => {
    if (d.emo.includes("e_fear")) return "cat_safety";
    if (d.comp.includes("c_reask") || d.comp.includes("c_check")) return "cat_certainty";
    if (d.emo.includes("e_shame") || d.emo.includes("e_guilt")) return "cat_morality";
    return cats[0].id;
  };

  const steps = ["thought", "trig", "emo", "comp", "cats"];
  const s = steps[step];

  const finish = () => {
    const suggested = d.cats.length ? d.cats : [suggestCat()];
    onDone(mk2({ ...d, cats: suggested, id: base.id || "t" + Date.now(),
      date: base.date || new Date().toISOString(), intensity: base.intensity || 6,
      note: base.note || "", _new: !base.id }));
  };

  return (
    <Sheet open onClose={onClose} title={base.id ? "Edit categorisation" : "Add a thought"} full>
      <div className="flex gap-1.5 mb-6">
        {steps.map((_, i) => (
          <div key={i} className="h-1 flex-1 rounded-full" style={{ background: i <= step ? "var(--accent)" : "var(--border)" }} />
        ))}
      </div>

      <div key={step} className="anim-up">
        <div className="flex gap-2.5 mb-5">
          <div className="w-7 h-7 rounded-full bg-[var(--soft)] grid place-items-center text-[var(--accent)] shrink-0 mt-0.5"><IconSpark size={15} /></div>
          <p className="text-[17px] leading-snug text-[var(--text)]">
            {s === "thought" && "What was the thought, in your words?"}
            {s === "trig" && "What set it off?"}
            {s === "emo" && "What emotion was present? (Pick any that fit.)"}
            {s === "comp" && "Did you do something to relieve it?"}
            {s === "cats" && "Where does this belong? You can choose more than one."}
          </p>
        </div>

        {s === "thought" && (
          <textarea value={d.thought} onChange={e => setD(x => ({ ...x, thought: e.target.value }))} autoFocus
            placeholder="The intrusive thought, doubt or image"
            className="w-full h-28 rounded-2xl p-4 bg-[var(--surface-2)] border border-[var(--border)] text-[15px] text-[var(--text)] placeholder:text-[var(--muted)] resize-none" />
        )}
        {s === "trig" && (
          <div className="flex flex-wrap gap-2">
            {Object.entries(TRIGGERS).map(([id, l]) => <Chip key={id} active={d.trig.includes(id)} onClick={() => single("trig", id)}>{l}</Chip>)}
          </div>
        )}
        {s === "emo" && (
          <div className="flex flex-wrap gap-2">
            {Object.entries(EMOTIONS_D).map(([id, l]) => <Chip key={id} active={d.emo.includes(id)} onClick={() => toggle("emo", id)}>{l}</Chip>)}
          </div>
        )}
        {s === "comp" && (
          <div className="flex flex-wrap gap-2">
            {Object.entries(COMPULSIONS).map(([id, l]) => <Chip key={id} active={d.comp.includes(id)} onClick={() => toggle("comp", id)}>{l}</Chip>)}
          </div>
        )}
        {s === "cats" && (
          <>
            <p className="text-[13px] text-[var(--muted)] mb-3">
              {APP} suggests <span className="text-[var(--accent)]">{catOf(suggestCat(), cats).label}</span>. Confirm or change it.
            </p>
            <div className="flex flex-wrap gap-2">
              {cats.map(c => <Chip key={c.id} active={(d.cats.length ? d.cats : [suggestCat()]).includes(c.id)} onClick={() => toggle("cats", c.id)}>{c.label}</Chip>)}
            </div>
          </>
        )}
      </div>

      <div className="grid grid-cols-2 gap-3 mt-7">
        <Button variant="outline" onClick={() => step === 0 ? onClose() : setStep(step - 1)}>{step === 0 ? "Cancel" : "Back"}</Button>
        {step < steps.length - 1
          ? <Button onClick={() => setStep(step + 1)} disabled={s === "thought" && !d.thought.trim()}>Continue</Button>
          : <Button onClick={finish}><IconCheck size={17} sw={2.2} />Confirm</Button>}
      </div>
    </Sheet>
  );
}

/* build a rich thought (with flat display fields) from wizard draft */
const mk2 = (o) => ({
  ...o,
  trigger:    o.trig[0] ? TRIGGERS[o.trig[0]] : "Not yet recorded",
  emotion:    o.emo[0] ? EMOTIONS_D[o.emo[0]] : "Unease",
  compulsion: o.comp[0] ? COMPULSIONS[o.comp[0]] : "Not yet recorded",
  category:   o.cats[0],
  related: [],
});

/* ═══════════════════════════════════════════════════════════════════════
   SCREEN 4 · REFLECTION TIME
   ═══════════════════════════════════════════════════════════════════════ */
function ReflectScreen({ go, openMenu, thoughts, memos, preset }) {
  const [stage, setStage] = useState("choose");     // choose | pickThought | talk
  const [subject, setSubject] = useState(null);
  const [step, setStep] = useState(0);
  const chat = useChat();

  /* context the model reflects against: the focus item plus prior records */
  const ctx = (subjectObj = subject) => buildContext(thoughts,
    subjectObj?.thought ? `FOCUS THOUGHT: "${subjectObj.thought.thought}"` : "");

  const begin = (label, subjectObj) => {
    setSubject(subjectObj); setStage("talk"); setStep(0);
    chat.setMsgs([]);
    chat.send(label, { mode: "reflect", context: ctx(subjectObj) });
  };

  /* arrived here from a thought on the MindMap → open it straight away */
  useEffect(() => {
    if (preset) begin(`Let's look at: “${preset.thought}”`, { label: "From your MindMap", thought: preset });
  }, [preset]);

  const answer = (text) => {
    setStep(s => s + 1);
    chat.send(text, { mode: "reflect", context: ctx() });
  };

  if (stage === "talk") {
    /* reflection stays bounded — the closing actions appear once the record
       has been walked through, just as the scripted version did */
    const done = step >= REFLECTION_SCRIPT.length - 1;
    const last = chat.msgs[chat.msgs.length - 1];
    const chips = (!chat.typing && last?.from === "bot" && last.chips) || [];
    return (
      <>
        <Header title="Reflection Time" subtitle={subject?.label} onBack={() => setStage("choose")} onAvatar={() => go("profile")} />
        <div className="scroll flex-1 px-5 pb-2 space-y-2.5">
          {subject?.memo && <div className="mb-4"><MemoCard memo={subject.memo} /></div>}
          {subject?.thought && (
            <Card className="p-4 mb-4">
              <div className="text-[11px] uppercase tracking-wide text-[var(--muted)]">Reflecting on</div>
              <div className="text-[15px] text-[var(--text)] mt-1.5 leading-snug">“{subject.thought.thought}”</div>
            </Card>
          )}
          {chat.msgs.map(m => <Bubble key={m.id} m={m} />)}
          {chat.typing && <Typing />}
          {!chat.typing && chips.length > 0 && (
            <div className="flex flex-wrap gap-2 pt-1 anim-up">
              {chips.map(c => <Chip key={c} onClick={() => answer(c)}>{c}</Chip>)}
            </div>
          )}
          {done && !chat.typing && (
            <div className="pt-3 anim-up space-y-2.5">
              <Button variant="soft" onClick={() => go("map")}><IconMap size={17} />Open the map</Button>
              <Button variant="outline" onClick={() => { setStage("choose"); chat.setMsgs([]); }}>Reflect on something else</Button>
            </div>
          )}
          <div ref={chat.endRef} className="h-2" />
        </div>
        <Composer placeholder="Type or dictate" onSend={answer} />
      </>
    );
  }

  if (stage === "pickThought") {
    return (
      <>
        <Header title="Previous thoughts" subtitle="From your MindMap" onBack={() => setStage("choose")} onAvatar={() => go("profile")} />
        <div className="scroll flex-1 px-5 pb-6 space-y-3 stagger">
          {thoughts.map(t => (
            <Card key={t.id} className="p-4 press cursor-pointer"
                  onClick={() => begin(`Let's look at: “${t.thought}”`, { label: catOf(t.category).label, thought: t })}>
              <div className="flex items-center gap-2 mb-1.5">
                <span className="w-2 h-2 rounded-full" style={{ background: `hsl(${catOf(t.category).hue} 55% 55%)` }} />
                <span className="text-[11.5px] text-[var(--muted)]">{catOf(t.category).label}</span>
                <span className="text-[11.5px] text-[var(--muted)] ml-auto">{fmtDate(t.date)}</span>
              </div>
              <div className="text-[15px] text-[var(--text)] leading-snug">“{t.thought}”</div>
            </Card>
          ))}
        </div>
      </>
    );
  }

  const latest = memos[0];
  return (
    <>
      <Header title="Reflection Time" onMenu={openMenu} onAvatar={() => go("profile")} />
      <div className="scroll flex-1 px-5 pb-2">
        <h2 className="text-[26px] leading-tight font-light tracking-tight text-[var(--text)] mt-3 mb-7">
          What would you like<br />to reflect on?
        </h2>

        <div className="stagger space-y-3">
          <button onClick={() => begin("Let's go through my latest voice memo.", { label: "Latest voice memo", memo: latest })}
            className="press w-full text-left rounded-3xl p-4 bg-[var(--surface)] border border-[var(--border)]"
            style={{ boxShadow: "var(--shadow)" }}>
            <div className="flex items-center gap-3.5">
              <div className="w-11 h-11 rounded-full grid place-items-center bg-[var(--accent)] text-[var(--on-accent)] shrink-0">
                <IconPlay size={19} />
              </div>
              <div className="flex-1 min-w-0">
                <div className="text-[15.5px] font-medium text-[var(--text)]">The latest voice memo</div>
                <div className="text-[12.5px] text-[var(--muted)] mt-0.5 truncate">
                  {latest.title} · {fmtDur(latest.duration)} · {fmtDate(latest.date)}
                </div>
              </div>
            </div>
          </button>

          <button onClick={() => setStage("pickThought")}
            className="press w-full text-left rounded-3xl p-4 bg-[var(--surface)] border border-[var(--border)] flex items-center gap-3.5"
            style={{ boxShadow: "var(--shadow)" }}>
            <div className="w-11 h-11 rounded-2xl grid place-items-center bg-[var(--soft)] text-[var(--accent)] shrink-0">
              <IconMap size={20} />
            </div>
            <div className="flex-1">
              <div className="text-[15.5px] font-medium text-[var(--text)]">A previous thought</div>
              <div className="text-[12.5px] text-[var(--muted)] mt-0.5">{thoughts.length} saved in your map</div>
            </div>
            <IconChev size={18} className="text-[var(--muted)]" />
          </button>

          <button onClick={() => begin("I'd like to start with something else.", { label: "Something else" })}
            className="press w-full text-left rounded-3xl p-4 bg-[var(--surface)] border border-[var(--border)] flex items-center gap-3.5"
            style={{ boxShadow: "var(--shadow)" }}>
            <div className="w-11 h-11 rounded-2xl grid place-items-center bg-[var(--soft)] text-[var(--accent)] shrink-0">
              <IconSpark size={20} />
            </div>
            <div className="flex-1">
              <div className="text-[15.5px] font-medium text-[var(--text)]">Something else</div>
              <div className="text-[12.5px] text-[var(--muted)] mt-0.5">Start from wherever you are</div>
            </div>
            <IconChev size={18} className="text-[var(--muted)]" />
          </button>
        </div>

        <p className="text-[13px] text-[var(--muted)] mt-7 text-center leading-relaxed">
          For something else, type or dictate to begin.
        </p>
      </div>
      <Composer placeholder="Type" onSend={(t) => begin(t, { label: "Something else" })} />
    </>
  );
}

/* ═══════════════════════════════════════════════════════════════════════
   SCREEN 5 · COMPULSION TRIGGER EXERCISE
   ═══════════════════════════════════════════════════════════════════════ */
const EXERCISE_STEPS = ["scenario", "thought", "compulsion", "before", "sit", "after", "summary"];

function ExerciseScreen({ go, openMenu, thoughts, preset, toast }) {
  const [scenario, setScenario] = useState(preset || thoughts[0]);
  const [picking, setPicking] = useState(false);
  const [step, setStep] = useState(0);
  const [answers, setAnswers] = useState({ thought: "", compulsion: "" });
  const [before, setBefore] = useState(7);
  const [after, setAfter] = useState(4);

  /* the sit-with-it timer */
  const TOTAL = 120;
  const [left, setLeft] = useState(TOTAL);
  const [running, setRunning] = useState(false);
  const tick = useRef(null);

  useEffect(() => {
    if (!running) { clearInterval(tick.current); return; }
    tick.current = setInterval(() => setLeft(l => {
      if (l <= 1) { clearInterval(tick.current); setRunning(false); return 0; }
      return l - 1;
    }), 1000);
    return () => clearInterval(tick.current);
  }, [running]);

  useEffect(() => { if (preset) { setScenario(preset); setStep(0); } }, [preset]);

  const name = EXERCISE_STEPS[step];
  const next = () => setStep(s => Math.min(s + 1, EXERCISE_STEPS.length - 1));
  const back = () => step === 0 ? go("home") : setStep(s => s - 1);

  const stopAll = () => { setRunning(false); clearInterval(tick.current); toast("Exercise stopped — that's fine"); go("home"); };

  return (
    <>
      <Header title="Trigger Exercise" subtitle={`Step ${step + 1} of ${EXERCISE_STEPS.length}`}
              onBack={back} onAvatar={() => go("profile")} />

      <div className="shrink-0 px-5 pb-4 flex gap-1.5">
        {EXERCISE_STEPS.map((_, i) => (
          <div key={i} className="h-1 flex-1 rounded-full transition-colors"
               style={{ background: i <= step ? "var(--accent)" : "var(--border)" }} />
        ))}
      </div>

      <div className="scroll flex-1 px-5 pb-6">
        <div key={name} className="anim-up">

          {name === "scenario" && (
            <>
              <p className="text-[13px] text-[var(--muted)] mb-3">A situation from your map</p>
              <Card className="p-5 bg-[var(--soft)]">
                <div className="text-[11px] uppercase tracking-wide text-[var(--accent)]">Scenario</div>
                <p className="text-[19px] leading-snug text-[var(--text)] mt-2">
                  You are {scenario.trigger.toLowerCase()} and the thought arrives: “{scenario.thought}”
                </p>
              </Card>
              <button onClick={() => setPicking(true)} className="press w-full mt-3 text-[13.5px] text-[var(--muted)] py-2">
                Choose a different scenario
              </button>
              <p className="text-[13.5px] text-[var(--muted)] leading-relaxed mt-6">
                You'll be asked to bring this to mind, notice the urge, and let it pass without acting on it.
                You can stop at any point.
              </p>
              <Button className="w-full mt-6" onClick={next}>Start exercise</Button>
            </>
          )}

          {name === "thought" && (
            <StepPrompt q="Bringing that to mind — what thought appears now?"
              value={answers.thought} onChange={v => setAnswers(a => ({ ...a, thought: v }))}
              chips={[scenario.thought, "Something worse than usual", "It feels quieter today"]}
              onNext={next} />
          )}

          {name === "compulsion" && (
            <StepPrompt q="What would you normally do to make it stop?"
              value={answers.compulsion} onChange={v => setAnswers(a => ({ ...a, compulsion: v }))}
              chips={[scenario.compulsion, "Ask someone for reassurance", "Check again"]}
              onNext={next} />
          )}

          {name === "before" && (
            <RatingStep title="How strong is the discomfort right now?" value={before} onChange={setBefore}
                        onNext={next} cta="Begin the pause" />
          )}

          {name === "sit" && (
            <div className="flex flex-col items-center pt-4">
              <p className="text-[15.5px] text-center text-[var(--text)] leading-relaxed max-w-[280px]">
                Stay with the discomfort. Don't {answers.compulsion ? answers.compulsion.toLowerCase() : "act on the urge"} — just let it be there.
              </p>

              <div className="relative mt-8 mb-7">
                <svg width="200" height="200" className="-rotate-90">
                  <circle cx="100" cy="100" r="88" stroke="var(--border)" strokeWidth="10" fill="none" />
                  <circle cx="100" cy="100" r="88" stroke="var(--accent)" strokeWidth="10" fill="none"
                    strokeLinecap="round" strokeDasharray={2 * Math.PI * 88}
                    strokeDashoffset={2 * Math.PI * 88 * (1 - left / TOTAL)}
                    style={{ transition: "stroke-dashoffset 1s linear" }} />
                </svg>
                <div className="absolute inset-0 grid place-items-center">
                  <div className="text-center">
                    <div className="text-[40px] font-light tabular-nums tracking-tight text-[var(--text)]">{fmtDur(left)}</div>
                    <div className="text-[12.5px] text-[var(--muted)] mt-1">
                      {running ? "Breathe. It will pass." : left === 0 ? "Done" : "Paused"}
                    </div>
                  </div>
                </div>
              </div>

              <div className="w-full space-y-2.5">
                {left > 0 && (
                  <Button onClick={() => setRunning(r => !r)}>
                    {running ? <><IconPause size={17} />Pause</> : <><IconPlay size={17} />{left === TOTAL ? "Start" : "Continue"}</>}
                  </Button>
                )}
                <Button variant="soft" onClick={() => { setRunning(false); next(); }}>
                  {left === 0 ? "Continue" : "Finish early"}
                </Button>
                <Button variant="ghost" onClick={stopAll}><IconStop size={16} />Stop exercise</Button>
              </div>
            </div>
          )}

          {name === "after" && (
            <RatingStep title="How is the discomfort now?" value={after} onChange={setAfter}
                        hint={`You started at ${before}/10`} onNext={next} cta="See summary" />
          )}

          {name === "summary" && (
            <div className="pt-2">
              <div className="text-center mb-7">
                <div className="w-16 h-16 rounded-full mx-auto grid place-items-center bg-[var(--soft)] text-[var(--accent)]">
                  <IconCheck size={30} sw={2} />
                </div>
                <h2 className="text-[22px] font-medium text-[var(--text)] mt-4">Exercise complete</h2>
                <p className="text-[13.5px] text-[var(--muted)] mt-1.5">You stayed with it without acting.</p>
              </div>

              <Card className="p-5">
                <div className="flex items-end justify-between gap-6">
                  {[["Before", before], ["After", after]].map(([l, v]) => (
                    <div key={l} className="flex-1 text-center">
                      <div className="h-28 flex items-end justify-center">
                        <div className="w-12 rounded-t-xl transition-all"
                             style={{ height: `${v * 10}%`, background: l === "Before" ? "var(--border)" : "var(--accent)" }} />
                      </div>
                      <div className="text-[20px] font-medium text-[var(--text)] mt-2 tabular-nums">{v}</div>
                      <div className="text-[12px] text-[var(--muted)]">{l}</div>
                    </div>
                  ))}
                  <div className="flex-1 text-center">
                    <div className="text-[30px] font-light tabular-nums"
                         style={{ color: after <= before ? "var(--accent)" : "var(--muted)" }}>
                      {after - before > 0 ? "+" : ""}{after - before}
                    </div>
                    <div className="text-[12px] text-[var(--muted)] mt-1">change</div>
                  </div>
                </div>
              </Card>

              <div className="mt-4 rounded-3xl border border-[var(--border)] overflow-hidden">
                {[["Scenario", scenario.trigger], ["Thought", answers.thought || scenario.thought],
                  ["Urge resisted", answers.compulsion || scenario.compulsion], ["Time sat with it", fmtDur(TOTAL - left)]]
                  .map(([k, v], i) => (
                  <div key={k} className={`px-4 py-3 bg-[var(--surface)] ${i ? "border-t border-[var(--border)]" : ""}`}>
                    <div className="text-[11px] uppercase tracking-wide text-[var(--muted)]">{k}</div>
                    <div className="text-[14px] text-[var(--text)] mt-0.5">{v}</div>
                  </div>
                ))}
              </div>

              <div className="space-y-2.5 mt-6">
                <Button onClick={() => { toast("Saved to your map"); go("map"); }}>Save to my map</Button>
                <Button variant="outline" onClick={() => go("home")}>Back to home</Button>
              </div>
            </div>
          )}
        </div>
      </div>

      <Sheet open={picking} onClose={() => setPicking(false)} title="Choose a scenario">
        <div className="space-y-2.5">
          {thoughts.map(t => (
            <button key={t.id} onClick={() => { setScenario(t); setPicking(false); }}
              className="press w-full text-left p-4 rounded-2xl bg-[var(--surface-2)] border border-[var(--border)]">
              <div className="text-[11.5px] text-[var(--muted)]">{t.trigger}</div>
              <div className="text-[14.5px] text-[var(--text)] mt-1">“{t.thought}”</div>
            </button>
          ))}
        </div>
      </Sheet>
    </>
  );
}

function StepPrompt({ q, value, onChange, chips, onNext }) {
  return (
    <>
      <div className="flex gap-2.5 mb-5">
        <div className="w-7 h-7 rounded-full bg-[var(--soft)] grid place-items-center text-[var(--accent)] shrink-0 mt-0.5">
          <IconSpark size={15} />
        </div>
        <p className="text-[18px] leading-snug text-[var(--text)]">{q}</p>
      </div>
      <div className="flex flex-wrap gap-2 mb-4">
        {chips.filter(Boolean).map(c => <Chip key={c} active={value === c} onClick={() => onChange(c)}>{c}</Chip>)}
      </div>
      <textarea value={value} onChange={e => onChange(e.target.value)} placeholder="Or write your own"
        className="w-full h-28 rounded-2xl p-4 bg-[var(--surface-2)] border border-[var(--border)]
                   text-[15px] text-[var(--text)] placeholder:text-[var(--muted)] resize-none" />
      <Button className="w-full mt-5" onClick={onNext} disabled={!value.trim()}>Continue</Button>
    </>
  );
}

function RatingStep({ title, value, onChange, onNext, cta, hint }) {
  const labels = ["None", "Mild", "Noticeable", "Strong", "Overwhelming"];
  return (
    <div className="pt-2">
      <p className="text-[18px] leading-snug text-[var(--text)]">{title}</p>
      {hint && <p className="text-[13px] text-[var(--muted)] mt-1.5">{hint}</p>}

      <div className="text-center my-10">
        <div className="text-[64px] font-extralight tabular-nums leading-none text-[var(--accent)]">{value}</div>
        <div className="text-[13.5px] text-[var(--muted)] mt-2">{labels[Math.min(Math.floor(value / 2.5), 4)]}</div>
      </div>

      <input type="range" min="0" max="10" value={value}
        style={{ "--pct": `${value * 10}%` }}
        onChange={e => onChange(+e.target.value)} />
      <div className="flex justify-between text-[11.5px] text-[var(--muted)] mt-2 px-0.5">
        <span>0</span><span>10</span>
      </div>

      <Button className="w-full mt-9" onClick={onNext}>{cta}</Button>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════════════
   CHAT SCREEN (home companion, expanded)
   ═══════════════════════════════════════════════════════════════════════ */
function ChatScreen({ go, chat, onSend }) {
  return (
    <>
      <Header title="Companion" subtitle="Remembers what you've saved" onBack={() => go("home")} onAvatar={() => go("profile")} />
      <div className="scroll flex-1 px-5 pb-2 space-y-2.5">
        {chat.msgs.map(m => (
          <div key={m.id}>
            <Bubble m={m} />
            {m.chips && (
              <div className="flex flex-wrap gap-2 mt-2.5">
                {m.chips.map(c => <Chip key={c} onClick={() => onSend(c)}>{c}</Chip>)}
              </div>
            )}
          </div>
        ))}
        {chat.typing && <Typing />}
        <div ref={chat.endRef} className="h-2" />
      </div>
      <Composer placeholder="What is on your mind?" onSend={onSend} />
    </>
  );
}

/* ═══════════════════════════════════════════════════════════════════════
   NAVIGATION SHELL
   ═══════════════════════════════════════════════════════════════════════ */
const NAV = [
  { id: "home",     label: "Home",    Icon: IconHome },
  { id: "capture",  label: "Capture", Icon: IconMic },
  { id: "map",      label: "Map",     Icon: IconMap },
  { id: "reflect",  label: "Reflect", Icon: IconSpark },
  { id: "profile",  label: "Profile", Icon: IconUser },
];

function BottomNav({ screen, go }) {
  const active = screen === "chat" ? "home" : screen === "exercise" ? "map" : screen;
  return (
    <div className="shrink-0 px-3 pb-5 pt-1.5 border-t border-[var(--border)] bg-[var(--surface)]/80 backdrop-blur-xl">
      <div className="flex">
        {NAV.map(({ id, label, Icon }) => {
          const on = active === id;
          return (
            <button key={id} onClick={() => go(id)}
              className="press flex-1 flex flex-col items-center gap-1 py-1.5"
              style={{ color: on ? "var(--accent)" : "var(--muted)" }}>
              <Icon size={22} sw={on ? 1.9 : 1.5} />
              <span className="text-[10px]" style={{ fontWeight: on ? 600 : 400 }}>{label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function App() {
  const [screen, setScreen] = useState("home");
  const [menu, setMenu] = useState(false);
  const [setting, setSetting] = useState(null);
  const [toastMsg, setToastMsg] = useState("");
  const [thoughts, setThoughts] = useState(THOUGHTS);
  const [memos, setMemos] = useState(MEMOS);
  const [cats, setCats] = useState(CATEGORIES);
  const [connections, setConnections] = useState(CONNECTIONS);
  const [exercisePreset, setExercisePreset] = useState(null);
  const [reflectPreset, setReflectPreset] = useState(null);
  const replyIdx = useRef(0);

  const homeChat = useChat();

  const toast = (m) => { setToastMsg(m); setTimeout(() => setToastMsg(""), 2400); };

  const go = (s, opts) => {
    if (opts?.scenario) setExercisePreset(opts.scenario);
    if (s === "reflect") setReflectPreset(opts?.thought || null);
    setScreen(s);
  };

  const sendToCompanion = (text) => {
    homeChat.send(text, { mode: "home", context: buildContext(thoughts) });
    if (screen === "home") setScreen("chat");
  };

  const saveMemo = (m) => setMemos(prev => [m, ...prev]);

  /* Find or create the category the model named, and return its id. */
  const resolveCat = (label) => {
    const clean = (label || "").trim();
    if (!clean) return "cat_safety";
    const hit = cats.find(c => c.label.toLowerCase() === clean.toLowerCase());
    if (hit) return hit.id;
    const id = "cat_" + clean.toLowerCase().replace(/[^a-z0-9]+/g, "_");
    setCats(prev => prev.some(c => c.id === id) ? prev
      : [...prev, { id, label: clean, hue: (prev.length * 53 + 195) % 360 }]);
    return id;
  };

  /* Everything the companion extracts lands here: the MindMap grows with the
     conversation, and a suggested pattern arrives as a hypothesis to accept. */
  const ingestAI = (data) => {
    const t = data?.thought;
    if (!t?.thought) return;
    const catId = resolveCat(t.category);
    const id = "t" + Date.now();
    setThoughts(prev => [{
      id, thought: t.thought, cats: [catId], category: catId,
      trig: [], emo: [], comp: [],
      trigger: t.trigger || "Not yet recorded",
      emotion: t.emotion || "Unease",
      compulsion: t.compulsion || "Not yet recorded",
      intensity: Math.max(1, Math.min(10, +t.intensity || 5)),
      note: t.note || "Captured with the companion.",
      date: new Date().toISOString(), related: [], ai: true,
    }, ...prev]);
    if (data.pattern?.basis && thoughts[0]) {
      setConnections(prev => [{
        id: "k" + Date.now(), a: id, b: thoughts[0].id,
        basis: data.pattern.basis,
        strength: STRENGTH[data.pattern.strength] ? data.pattern.strength : "tentative",
        source: "ai", status: "suggested",
      }, ...prev]);
    }
    toast("Added to your MindMap");
  };
  useEffect(() => { AI_SINK.ingest = ingestAI; });

  const saveThought = (text) => {
    const id = "t" + Date.now();
    setThoughts(prev => [{
      id, cats: ["cat_safety"], category: "cat_safety",
      trig: [], emo: [], comp: [], trigger: "Not yet categorised",
      thought: text, emotion: "Unease", compulsion: "Not yet recorded",
      note: "Captured from the companion — categorise it when ready.",
      date: new Date().toISOString(), intensity: 5, related: [],
    }, ...prev]);
    /* ask the companion to structure the capture, then fill the card in place */
    askCompanion({ mode: "capture", context: buildContext(thoughts), history: [{ role: "user", content: text }] })
      .then(d => {
        const t = d?.thought;
        if (!t) return;
        const catId = resolveCat(t.category);
        upsertThought({
          id, cats: [catId], category: catId,
          trigger: t.trigger || "Not yet categorised",
          emotion: t.emotion || "Unease",
          compulsion: t.compulsion || "Not yet recorded",
          intensity: Math.max(1, Math.min(10, +t.intensity || 5)),
          note: t.note || "Captured — categorised by the companion.",
        });
        toast("Categorised");
      })
      .catch(() => {});
  };

  const upsertThought = (t) => setThoughts(prev => {
    const i = prev.findIndex(p => p.id === t.id);
    if (i === -1) return [t, ...prev];
    const copy = [...prev]; copy[i] = { ...copy[i], ...t }; return copy;
  });

  const shared = { go, openMenu: () => setMenu(true), thoughts, memos, toast };

  return (
    <div className="stage">
      <div className="device">
        <div className="notch" />
        <div className="pt-9 flex flex-col flex-1 min-h-0 relative">
          {screen === "home"     && <HomeScreen {...shared} chat={homeChat} />}
          {screen === "chat"     && <ChatScreen go={go} chat={homeChat} onSend={sendToCompanion} />}
          {screen === "capture"  && <CaptureScreen {...shared} onSaveMemo={saveMemo} onSaveThought={saveThought} />}
          {screen === "map"      && <MapScreen {...shared} onUpdate={upsertThought}
                                       cats={cats} setCats={setCats} connections={connections} setConnections={setConnections} />}
          {screen === "reflect"  && <ReflectScreen {...shared} preset={reflectPreset} />}
          {screen === "exercise" && <ExerciseScreen {...shared} preset={exercisePreset} />}
          {screen === "profile"  && <ProfileScreen {...shared} openSetting={setSetting} />}

          {/* the home composer lives outside the scroll area, as in the sketch */}
          {screen === "home" && <Composer placeholder="Type" onSend={sendToCompanion} />}

          <SideMenu open={menu} onClose={() => setMenu(false)} go={go} openSetting={setSetting} />
          <SettingSheet item={setting} onClose={() => setSetting(null)} toast={toast} />
          <Toast msg={toastMsg} />
        </div>

        <BottomNav screen={screen} go={go} />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  <ThemeProvider><App /></ThemeProvider>
);
</script>
</body>
