<style>
  /* ---------- Theme tokens ---------------------------------------------
     Accent is chosen by the person (see Appearance in the side menu).
     Surfaces derive from the accent so the whole app takes on their colour. */
  :root { --accent: #7c6cf0; }
  [data-accent="violet"]  { --accent: #7c6cf0; }
  [data-accent="green"]   { --accent: #4f9d76; }
  [data-accent="blue"]    { --accent: #4d8ed6; }
  [data-accent="amber"]   { --accent: #c2873c; }
  [data-accent="rose"]    { --accent: #d1738c; }
  [data-accent="graphite"]{ --accent: #6f7580; }

  [data-mode="light"] {
    --bg:        color-mix(in srgb, var(--accent) 5%, #f7f6f4);
    --surface:   color-mix(in srgb, var(--accent) 2%, #ffffff);
    --surface-2: color-mix(in srgb, var(--accent) 7%, #ffffff);
    --border:    color-mix(in srgb, var(--accent) 14%, #e7e5e1);
    --text:      color-mix(in srgb, var(--accent) 12%, #1c1b20);
    --muted:     color-mix(in srgb, var(--accent) 10%, #77757e);
    --soft:      color-mix(in srgb, var(--accent) 12%, #ffffff);
    --on-accent: #ffffff;
    --shadow:    0 1px 2px rgba(20,18,30,.04), 0 8px 24px -12px rgba(20,18,30,.18);
  }
  [data-mode="dark"] {
    --bg:        color-mix(in srgb, var(--accent) 7%, #0e0e12);
    --surface:   color-mix(in srgb, var(--accent) 9%, #17171d);
    --surface-2: color-mix(in srgb, var(--accent) 14%, #1c1c23);
    --border:    color-mix(in srgb, var(--accent) 18%, #2a2a33);
    --text:      color-mix(in srgb, var(--accent) 6%, #ecebf0);
    --muted:     color-mix(in srgb, var(--accent) 14%, #93919c);
    --soft:      color-mix(in srgb, var(--accent) 20%, #17171d);
    --on-accent: #ffffff;
    --shadow:    0 1px 2px rgba(0,0,0,.3), 0 12px 30px -14px rgba(0,0,0,.7);
  }

  /* classic serif body, intertwined with a technical monospace for meta/figures */
  :root {
    --serif: "Times New Roman", Times, Georgia, serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }
  html, body { height: 100%; }
  body {
    font-family: var(--serif);
    background: #e9e7e4;
    -webkit-font-smoothing: antialiased;
    margin: 0;
  }
  [data-mode="dark"] body { background: #08080b; }

  /* technical accents */
  .mono  { font-family: var(--mono); font-feature-settings: "tnum"; }
  .tnum  { font-variant-numeric: tabular-nums; }
  .wordmark { font-family: var(--serif); letter-spacing: .34em; text-transform: uppercase; }
  .eyebrow  { font-family: var(--mono); letter-spacing: .16em; text-transform: uppercase; }
  /* faint engraving grid — the "tech" layer under the classic type */
  .etch {
    background-image:
      linear-gradient(color-mix(in srgb, var(--accent) 8%, transparent) 1px, transparent 1px),
      linear-gradient(90deg, color-mix(in srgb, var(--accent) 8%, transparent) 1px, transparent 1px);
    background-size: 26px 26px;
  }

  /* the stage behind the phone, desktop only */
  .stage {
    min-height: 100dvh; display: grid; place-items: center; padding: 24px;
    background:
      radial-gradient(1000px 600px at 50% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 70%),
      var(--bg);
    transition: background .4s ease;
  }
  .device {
    width: 393px; height: 852px; max-height: calc(100dvh - 48px);
    border-radius: 46px; overflow: hidden; position: relative;
    background: var(--bg);
    box-shadow: 0 0 0 10px #101014, 0 0 0 12px #2c2c33, 0 40px 80px -30px rgba(0,0,0,.55);
    display: flex; flex-direction: column;
  }
  @media (max-width: 520px) {
    .stage { padding: 0; }
    .device { width: 100%; height: 100dvh; max-height: none; border-radius: 0; box-shadow: none; }
    .notch { display: none; }
  }
  .notch {
    position: absolute; top: 9px; left: 50%; transform: translateX(-50%);
    width: 108px; height: 30px; background: #101014; border-radius: 999px; z-index: 60;
  }

  .scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .scroll::-webkit-scrollbar { display: none; }

  input, textarea, button { font: inherit; color: inherit; }
  input:focus, textarea:focus { outline: none; }
  button { -webkit-tap-highlight-color: transparent; }

  /* ---------- motion ---------- */
  @keyframes fadeUp { from { opacity:0; transform: translateY(10px) } to { opacity:1; transform:none } }
  @keyframes fadeIn { from { opacity:0 } to { opacity:1 } }
  @keyframes slideUp { from { transform: translateY(100%) } to { transform:none } }
  @keyframes slideInLeft { from { transform: translateX(-100%) } to { transform:none } }
  @keyframes pulseRing {
    0% { transform: scale(.9); opacity:.6 } 70% { transform: scale(1.5); opacity:0 } 100% { opacity:0 }
  }
  @keyframes bar { 0%,100% { transform: scaleY(.25) } 50% { transform: scaleY(1) } }
  @keyframes blink { 0%,80%,100% { opacity:.25 } 40% { opacity:1 } }
  .anim-up   { animation: fadeUp .32s cubic-bezier(.2,.7,.3,1) both; }
  .anim-in   { animation: fadeIn .25s ease both; }
  .anim-sheet{ animation: slideUp .3s cubic-bezier(.2,.8,.25,1) both; }
  .anim-drawer{ animation: slideInLeft .28s cubic-bezier(.2,.8,.25,1) both; }
  .stagger > * { animation: fadeUp .4s cubic-bezier(.2,.7,.3,1) both; }
  .stagger > *:nth-child(1) { animation-delay: .02s }
  .stagger > *:nth-child(2) { animation-delay: .07s }
  .stagger > *:nth-child(3) { animation-delay: .12s }
  .stagger > *:nth-child(4) { animation-delay: .17s }
  .stagger > *:nth-child(5) { animation-delay: .22s }
  .press:active { transform: scale(.975); }
  .press { transition: transform .12s ease, background .2s ease, border-color .2s ease; }

  .wave span { display:block; width:3px; border-radius:3px; background: var(--on-accent); animation: bar 1s ease-in-out infinite; }

  /* range slider, themed */
  input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track {
    height: 6px; border-radius: 99px;
    background: linear-gradient(90deg, var(--accent) var(--pct,50%), var(--border) var(--pct,50%));
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 26px; height: 26px; border-radius: 99px; margin-top: -10px;
    background: var(--surface); border: 3px solid var(--accent); box-shadow: var(--shadow); cursor: pointer;
  }
</style>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, createContext, useContext, useCallback } = React;

/* ═══════════════════════════════════════════════════════════════════════
   MOCK DATA  — everything a backend would eventually serve
   ═══════════════════════════════════════════════════════════════════════ */

const USER = {
  name: "Nico",
  fullName: "Nico Di Legardia",
  handle: "@nico",
  since: "March 2026",
  avatar: "https://i.pravatar.cc/160?img=68",
};
const APP = "LVMINVS";

/* ── Shared nodes ──────────────────────────────────────────────────────
   Triggers, emotions and compulsions are their OWN nodes and are reused
   across thoughts. That reuse is what lets the map surface a pattern —
   e.g. many unrelated thoughts sharing one "mental reviewing" compulsion. */
const TRIGGERS = {
  tr_drive:  "Driving",
  tr_night:  "Walking alone at night",
  tr_leave:  "Leaving the house",
  tr_body:   "A physical sensation",
  tr_taboo:  "A frightening or taboo thought",
  tr_wake:   "Waking up",
  tr_code:   "An uncertain coding task",
  tr_shift:  "Before a work shift",
  tr_person: "Someone behaves badly",
};
const EMOTIONS_D = {
  e_fear: "Fear", e_dread: "Dread", e_guilt: "Guilt", e_shame: "Shame",
  e_anx: "Anxiety", e_anger: "Anger", e_unease: "Unease",
};
const COMPULSIONS = {
  c_phrase:  "Repeating a protective phrase",
  c_scan:    "Scanning and looking behind",
  c_check:   "Checking again",
  c_count:   "Counting 1·2·3",
  c_reassure:"Seeking reassurance",
  c_review:  "Mental reviewing",
  c_bodytest:"Testing the body",
  c_reask:   "Re-asking the same question",
  c_reconstruct:"Reconstructing lost time",
  c_ritual:  "A religious act to cancel a thought",
};
/* strings list the categorise flow offers as quick chips */
const EMOTIONS = Object.values(EMOTIONS_D);

/* Categories are the user's own organisational grouping — not diagnoses.
   Editable, renameable, multiple per thought. `ai` marks a suggested one. */
const CATEGORIES = [
  { id: "cat_safety",   label: "Personal safety",        hue: 210 },
  { id: "cat_certainty",label: "Certainty & checking",   hue: 275 },
  { id: "cat_health",   label: "Health",                 hue: 160 },
  { id: "cat_morality", label: "Meaning & morality",     hue: 35  },
  { id: "cat_worth",    label: "Self-worth & doing",     hue: 300 },
  { id: "cat_people",   label: "Relationships",          hue: 340 },
];

/* Thoughts carry the greatest weight. Each references shared node ids,
   and keeps flat display fields the other screens read. */
const mk = (o) => ({
  ...o,
  trigger:    TRIGGERS[o.trig[0]],
  emotion:    EMOTIONS_D[o.emo[0]],
  compulsion: COMPULSIONS[o.comp[0]],
  category:   o.cats[0],
  related: [],
});
const THOUGHTS = [
  mk({ id:"t1",  thought:"Please don't let me die while I drive.", cats:["cat_safety"],
       trig:["tr_drive"], emo:["e_fear"], comp:["c_phrase"], intensity:8, date:"2026-07-22T08:10:00",
       note:"Repeated twice on entering the car, then again every few minutes." }),
  mk({ id:"t2",  thought:"I hope nobody is following me.", cats:["cat_safety"],
       trig:["tr_night"], emo:["e_fear","e_dread"], comp:["c_scan"], intensity:7, date:"2026-07-21T23:05:00",
       note:"Scanned cars and kept looking behind on the walk home." }),
  mk({ id:"t3",  thought:"Don't die. Don't lose it.", cats:["cat_safety"],
       trig:["tr_taboo"], emo:["e_unease"], comp:["c_phrase","c_review"], intensity:5, date:"2026-07-20T19:40:00",
       note:"Arrived while reading; broke the immersion, then I checked for the next one." }),
  mk({ id:"t4",  thought:"What if I didn't lock the door?", cats:["cat_certainty"],
       trig:["tr_leave"], emo:["e_dread"], comp:["c_check","c_count"], intensity:7, date:"2026-07-20T08:30:00",
       note:"Went back, counted 1·2·3; restarted when it didn't feel complete." }),
  mk({ id:"t5",  thought:"Smoking has already damaged my lungs.", cats:["cat_health"],
       trig:["tr_body"], emo:["e_fear"], comp:["c_bodytest","c_reassure"], intensity:8, date:"2026-07-19T22:15:00",
       note:"Touched chest, tested breathing, kept re-asking about symptoms." }),
  mk({ id:"t6",  thought:"I must pray correctly or something bad will happen.", cats:["cat_morality","cat_certainty"],
       trig:["tr_taboo"], emo:["e_guilt"], comp:["c_ritual"], intensity:7, date:"2026-07-18T21:00:00",
       note:"A taboo thought created pressure to repeat the act until it felt right." }),
  mk({ id:"t7",  thought:"Maybe I only hug my brother out of obligation.", cats:["cat_morality","cat_people"],
       trig:["tr_taboo"], emo:["e_shame"], comp:["c_review"], intensity:6, date:"2026-07-17T18:20:00",
       note:"Demanded a verdict on whether I really care." }),
  mk({ id:"t8",  thought:"Without AI, could I build anything myself?", cats:["cat_worth"],
       trig:["tr_code"], emo:["e_shame"], comp:["c_reask","c_reassure"], intensity:6, date:"2026-07-16T15:10:00",
       note:"Asked for the whole solution, then felt dependent." }),
  mk({ id:"t9",  thought:"Analyse this again until I know what it means.", cats:["cat_certainty","cat_worth"],
       trig:["tr_taboo"], emo:["e_anx"], comp:["c_reask"], intensity:6, date:"2026-07-15T13:35:00",
       note:"Reformulated the same question to get more analysis." }),
  mk({ id:"t10", thought:"I already wasted the whole morning.", cats:["cat_worth"],
       trig:["tr_wake"], emo:["e_guilt"], comp:["c_reconstruct","c_review"], intensity:5, date:"2026-07-14T10:05:00",
       note:"Stayed in bed reconstructing what I could have done." }),
  mk({ id:"t11", thought:"What problem will management create today?", cats:["cat_people"],
       trig:["tr_shift"], emo:["e_anger","e_anx"], comp:["c_review"], intensity:5, date:"2026-07-13T12:00:00",
       note:"Rehearsed conflicts before the shift began." }),
  mk({ id:"t12", thought:"Is this person manipulative, or is it just me?", cats:["cat_people","cat_certainty"],
       trig:["tr_person"], emo:["e_anger"], comp:["c_review","c_reassure"], intensity:6, date:"2026-07-12T17:45:00",
       note:"Analysed motives to reach a universal verdict about them." }),
];

/* Connections between thoughts. Every one is a HYPOTHESIS with a basis,
   a strength and a status the user controls — never a stated cause. */
const CONNECTIONS = [
  { id:"k1", a:"t7",  b:"t12", basis:"Both end in mental reviewing to reach a verdict about a person.",
    strength:"tentative", source:"ai", status:"suggested" },
  { id:"k2", a:"t3",  b:"t10", basis:"The situations look unrelated — a walk and a morning — but both run on mental reviewing.",
    strength:"recurring", source:"ai", status:"suggested" },
  { id:"k3", a:"t8",  b:"t9",  basis:"Both return to re-ask the same question until it feels certain.",
    strength:"strong", source:"ai", status:"suggested" },
  { id:"k4", a:"t1",  b:"t6",  basis:"Both repeat a fixed phrase or act to prevent a feared outcome.",
    strength:"recurring", source:"ai", status:"accepted" },
  { id:"k5", a:"t4",  b:"t5",  basis:"A checking-for-certainty pattern (door vs. body).",
    strength:"tentative", source:"ai", status:"rejected" },
];

const MEMOS = [
  { id: "m1", title: "In the car", duration: 47,  date: "2026-07-22T08:14:00", linked: "t1" },
  { id: "m2", title: "Walking home", duration: 92, date: "2026-07-21T23:10:00", linked: "t2" },
  { id: "m3", title: "Before the shift", duration: 24, date: "2026-07-13T11:40:00", linked: null },
];

/* Scripted companion dialogue — stands in for the language model */
const HOME_REPLIES = [
  ["I'm here. Take whatever time you need to put it into words.",
   "You mentioned something close to this last Thursday. Would you like to look at them side by side?"],
  ["Thank you for telling me. Nothing needs to be resolved right now.",
   "Would it help to save this as a thought, or would you rather just leave it here?"],
  ["That sounds like it carried some weight today.",
   "There's a pattern I've noticed around evenings. Shall we come back to it in Reflection Time?"],
];

const REFLECTION_SCRIPT = [
  { q: "Let's start gently. What was happening just before this thought arrived?",
    chips: ["I was alone", "I was in a hurry", "I'd just spoken to someone"] },
  { q: "And what emotion was underneath it?",
    chips: ["Fear", "Guilt", "Shame", "Unease"] },
  { q: "What did it feel like you had to do?",
    chips: ["Check again", "Ask for reassurance", "I resisted it"] },
  { q: "Does this remind you of another situation you've recorded?",
    chips: ["Yes, the door one", "Not really", "I'm not sure"] },
  { q: "That connection is worth keeping. I've noted it beside both thoughts — you can see the link in your MindMap whenever you want.",
    chips: [], end: true },
];

const fmtDate = (iso) => {
  const d = new Date(iso);
  return d.toLocaleDateString("en-GB", { day: "numeric", month: "short" }) + " · " +
         d.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
};
const fmtDur = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

/* Category lookup. Screens that don't manage categories fall back to the
   seed list; the map passes its live, editable list in explicitly. */
const catOf = (id, list = CATEGORIES) =>
  list.find(c => c.id === id) || { id, label: "Uncategorised", hue: 250 };
const hueOf = (id, list) => catOf(id, list).hue;

/* Node dictionaries by kind — used to render shared trigger/emotion/compulsion nodes */
const NODE_DICT = { trigger: TRIGGERS, emotion: EMOTIONS_D, compulsion: COMPULSIONS };
const nodeIds  = (t, kind) => t[{ trigger: "trig", emotion: "emo", compulsion: "comp" }[kind]] || [];
const STRENGTH = {
  tentative: { label: "Tentative", w: .55 },
  recurring: { label: "Recurring", w: .78 },
  strong:    { label: "Strong",    w: 1   },
};

/* ═══════════════════════════════════════════════════════════════════════
   LIVE COMPANION  — talks to api_guide_test.py on the same origin.
   The scripted HOME_REPLIES / REFLECTION_SCRIPT above are kept only as the
   offline fallback shape; every real turn now comes from the model.
   ═══════════════════════════════════════════════════════════════════════ */
const AI_SINK = { ingest: () => {} };   // App wires the MindMap into this

async function askCompanion({ history, context = "", mode = "home" }) {
  const r = await fetch("/api/companion", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ history, context, mode }),
  });
  const data = await r.json();
  if (data.error) throw new Error(data.error);
  return data;
}

/* The model sees what the user already holds, so it can compare mechanisms
   across thoughts instead of treating each capture as isolated. */
const buildContext = (thoughts = [], extra = "") => [
  extra,
  "EXISTING RECORDS:",
  ...thoughts.slice(0, 12).map(t =>
    `- "${t.thought}" | trigger: ${t.trigger} | emotion: ${t.emotion} | compulsion: ${t.compulsion}`),
].filter(Boolean).join("\n");

const rid = () => Math.random().toString(36).slice(2);
const OFFLINE = "The companion is offline. Start the backend: ./.venv/bin/python api_guide_test.py";

/* ═══════════════════════════════════════════════════════════════════════
   ICONS

/* ═══════════════════════════════════════════════════════════════════════
   THEME
   ═══════════════════════════════════════════════════════════════════════ */
const ACCENTS = [
  { id: "violet",   label: "Violet",   swatch: "#7c6cf0" },
  { id: "green",    label: "Forest",   swatch: "#4f9d76" },
  { id: "blue",     label: "Tide",     swatch: "#4d8ed6" },
  { id: "amber",    label: "Amber",    swatch: "#c2873c" },
  { id: "rose",     label: "Rose",     swatch: "#d1738c" },
  { id: "graphite", label: "Graphite", swatch: "#6f7580" },
];
const ThemeCtx = createContext(null);
const useTheme = () => useContext(ThemeCtx);

function ThemeProvider({ children }) {
  const [mode, setMode] = useState(() => localStorage.getItem("loom.mode") || "light");
  const [accent, setAccent] = useState(() => localStorage.getItem("loom.accent") || "violet");
  useEffect(() => {
    document.documentElement.dataset.mode = mode;
    document.documentElement.dataset.accent = accent;
    localStorage.setItem("loom.mode", mode);
    localStorage.setItem("loom.accent", accent);
  }, [mode, accent]);
  return <ThemeCtx.Provider value={{ mode, setMode, accent, setAccent }}>{children}</ThemeCtx.Provider>;
}

/* ═══════════════════════════════════════════════════════════════════════
   CHAT ENGINE  — simulated companion
   ═══════════════════════════════════════════════════════════════════════ */
function useChat(initial = []) {
  const [msgs, setMsgs] = useState(initial);
  const [typing, setTyping] = useState(false);
  const endRef = useRef(null);

  useEffect(() => { endRef.current?.scrollIntoView({ behavior: "smooth", block: "end" }); }, [msgs, typing]);

  const push = (m) => setMsgs(prev => [...prev, { id: Math.random().toString(36).slice(2), ...m }]);

  /* Replies arrive one after another with a typing indicator between them */
  const reply = useCallback((lines, chips) => {
    const queue = Array.isArray(lines) ? lines : [lines];
    let delay = 0;
    queue.forEach((text, i) => {
      delay += 550 + text.length * 12;
      setTyping(true);
      setTimeout(() => {
        push({ from: "bot", text, chips: i === queue.length - 1 ? chips : null });
        if (i === queue.length - 1) setTyping(false);
      }, delay);
    });
  }, []);

  /* ── live turn ──────────────────────────────────────────────────────
     Appends the user's line, calls the backend, then lays the model's
     messages out one after another exactly like the scripted engine did. */
  const msgsRef = useRef(initial);
  const commit = (arr) => { msgsRef.current = arr; setMsgs(arr); };
  const reset  = useCallback((arr) => commit(Array.isArray(arr) ? arr : []), []);

  const send = useCallback(async (text, { mode = "home", context = "", onData } = {}) => {
    const next = [...msgsRef.current, { id: rid(), from: "me", text }];
    commit(next);
    setTyping(true);
    try {
      const data = await askCompanion({
        mode, context,
        history: next.map(m => ({ role: m.from === "me" ? "user" : "assistant", content: m.text })),
      });
      const lines = (data.reply || []).filter(Boolean);
      const bots = (lines.length ? lines : ["…"]).map((t, i) => ({
        id: rid(), from: "bot", text: t,
        chips: i === lines.length - 1 ? (data.chips || []) : null,
      }));
      commit([...msgsRef.current, ...bots]);
      AI_SINK.ingest(data);
      onData?.(data);
      return data;
    } catch (e) {
      commit([...msgsRef.current, { id: rid(), from: "bot", text: `${OFFLINE} (${e.message})` }]);
    } finally {
      setTyping(false);
    }
  }, []);

  return { msgs, typing, push, reply, send, endRef, setMsgs: reset };
}

/* Text + microphone composer. The mic simulates dictation. */
function Composer({ placeholder = "Type", onSend, autoFocus }) {
  const [text, setText] = useState("");
  const [listening, setListening] = useState(false);
  const timer = useRef(null);

  const dictate = () => {
    if (listening) { clearTimeout(timer.current); setListening(false); return; }
    setListening(true);
    timer.current = setTimeout(() => {
      setListening(false);
      setText(t => (t ? t + " " : "") + "I keep going back to check the door");
    }, 2200);
  };

  const submit = (e) => {
    e?.preventDefault();
    const v = text.trim();
    if (!v) return;
    setText(""); onSend(v);
  };

  return (
    <form onSubmit={submit} className="shrink-0 px-4 pb-4 pt-2">
      <div className="flex items-center gap-2 rounded-full bg-[var(--surface)] border border-[var(--border)] pl-5 pr-1.5 py-1.5"
           style={{ boxShadow: "var(--shadow)" }}>
        <input
          value={listening ? "" : text}
          autoFocus={autoFocus}
          onChange={e => setText(e.target.value)}
          placeholder={listening ? "Listening…" : placeholder}
          className="flex-1 bg-transparent py-2.5 text-[15px] text-[var(--text)] placeholder:text-[var(--muted)] min-w-0"
        />
        {text.trim()
          ? <button type="submit" className="press w-10 h-10 rounded-full grid place-items-center bg-[var(--accent)] text-[var(--on-accent)]">
              <IconSend size={19} />
            </button>
          : <button type="button" onClick={dictate}
              className={`press relative w-10 h-10 rounded-full grid place-items-center
                ${listening ? "bg-[var(--accent)] text-[var(--on-accent)]" : "text-[var(--muted)]"}`}>
              {listening && <span className="absolute inset-0 rounded-full bg-[var(--accent)]"
                                  style={{ animation: "pulseRing 1.4s infinite" }} />}
              <IconMic size={20} />
            </button>}
      </div>
    </form>
  );
}
