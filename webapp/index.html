<!DOCTYPE html>
<html lang="en" data-mode="light" data-accent="violet">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LVMINVS</title>
    <meta name="description" content="Notice compulsions and overthinking, and understand yourself better." />

    <!-- PWA / installable web app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6366f1" />

    <!-- iOS home-screen installation. `apple-mobile-web-app-capable` makes
         the installed app run without the Safari chrome. The status bar
         style must be `default` (light) or `black-translucent`; the latter
         extends the app under the status bar, which our safe-area inset
         handling already accounts for. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LVMINVS" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
